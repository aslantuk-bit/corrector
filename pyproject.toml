[project]
name = "corrector"
version = "0.4.1"
description = "Корректор: проверка орфографии, пунктуации и стиля юридических текстов (ru/kk) с флешки"
requires-python = ">=3.13,<3.14"
license = "MIT"
authors = [{ name = "TAS" }]
dependencies = ["PySide6-Essentials==6.11.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
qt_api = "pyside6"
markers = ["lt: требует LanguageTool и Java в vendor/ (пропускается, если их нет)"]
