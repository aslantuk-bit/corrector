name: windows

on:
  push:
    branches: [main, stage0]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Зависимости
        run: pip install -r requirements-dev.txt

      - name: Тесты
        run: python -m pytest -q

      - name: Java по замку
        run: python sborka/fetch_artifacts.py jre-windows-x64

      - name: PyInstaller
        run: pyinstaller --noconfirm sborka/launchcheck.spec

      - name: Папка поставки и архив
        run: python sborka/assemble.py launchcheck

      - name: Диагностика Java в кириллическом и латинском пути
        shell: pwsh
        run: |
          chcp
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $bundle = "dist/bundle/Проверка_запуска"
          Write-Host "=== bin/*.dll в приложенной Java ==="
          Get-ChildItem "$bundle/java/bin" -Filter *.dll | Select-Object -ExpandProperty Name | Sort-Object | Select-Object -First 40
          Write-Host "=== java -version из кириллического пути ==="
          & "$bundle/java/bin/java.exe" -version 2>&1 | Out-String | Write-Host
          Write-Host "код: $LASTEXITCODE"
          Write-Host "=== копия в латинский путь ==="
          $ascii = Join-Path $env:RUNNER_TEMP "launchcheck-ascii"
          Copy-Item $bundle $ascii -Recurse -Force
          & "$ascii/java/bin/java.exe" -version 2>&1 | Out-String | Write-Host
          Write-Host "код: $LASTEXITCODE"
          Write-Host "=== exe из латинского пути ==="
          $out = Join-Path $env:RUNNER_TEMP "report-ascii"
          New-Item -ItemType Directory -Force $out | Out-Null
          $p = Start-Process -FilePath "$ascii/Проверка_запуска.exe" -ArgumentList @("--report-only", "--out", $out) -Wait -PassThru
          Get-Content (Join-Path $out "отчёт_запуска.txt")
          Write-Host "код exe: $($p.ExitCode)"
          Write-Host "=== exe из кириллического пути (как раньше) ==="
          $out2 = Join-Path $env:RUNNER_TEMP "report-cyr"
          New-Item -ItemType Directory -Force $out2 | Out-Null
          $p2 = Start-Process -FilePath (Resolve-Path "$bundle/Проверка_запуска.exe").Path -ArgumentList @("--report-only", "--out", $out2) -Wait -PassThru
          Get-Content (Join-Path $out2 "отчёт_запуска.txt")
          Write-Host "код exe: $($p2.ExitCode)"

      - uses: actions/upload-artifact@v7
        with:
          name: proverka-zapuska-win64
          path: dist/bundle/*.zip

      - uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: dist/bundle/*.zip
