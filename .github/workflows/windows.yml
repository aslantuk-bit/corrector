name: windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write  # релиз по тэгу; по умолчанию токен workflow только читает

jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Зависимости
        run: pip install -r requirements-dev.txt

      - name: Тесты
        run: python -m pytest -q

      - name: Кэш скачанных артефактов (Java, LanguageTool)
        uses: actions/cache@v4
        with:
          path: vendor/_cache
          key: artifacts-${{ hashFiles('sborka/artifacts.lock') }}

      - name: Java и LanguageTool по замку
        run: |
          python sborka/fetch_artifacts.py jre-windows-x64 languagetool-20260914
          python sborka/trim_languagetool.py vendor/languagetool-20260914 vendor/languagetool-ru

      - name: PyInstaller
        run: |
          pyinstaller --noconfirm sborka/launchcheck.spec
          pyinstaller --noconfirm sborka/corrector.spec

      - name: Папки поставки и архивы
        run: |
          python sborka/assemble.py launchcheck
          python sborka/assemble.py corrector

      - name: Проверка запуска (собранная программа без окна)
        shell: pwsh
        run: |
          $exe = (Resolve-Path "dist/bundle/Проверка_запуска/Проверка_запуска.exe").Path
          $out = Join-Path $env:RUNNER_TEMP "report"
          New-Item -ItemType Directory -Force $out | Out-Null
          $p = Start-Process -FilePath $exe -ArgumentList @("--report-only", "--out", $out) -Wait -PassThru
          Get-Content (Join-Path $out "отчёт_запуска.txt")
          if ($p.ExitCode -ne 0) { throw "код возврата $($p.ExitCode)" }

      - name: Корректор (собранная командная строка с LanguageTool)
        shell: pwsh
        run: |
          $exe = (Resolve-Path "dist/bundle/Корректор/Корректор-cli.exe").Path
          $out = Join-Path $env:RUNNER_TEMP "korrektor"
          New-Item -ItemType Directory -Force $out | Out-Null
          & $exe --check (Resolve-Path "tests/samples/образец.docx").Path --report --out $out
          if ($LASTEXITCODE -ne 0) { throw "код возврата $LASTEXITCODE" }
          $report = Join-Path $out "образец_отчёт.txt"
          Get-Content $report
          if (-not (Select-String -Path $report -Pattern "lt — работает" -Quiet)) { throw "LanguageTool не заработал в сборке" }
          if (-not (Select-String -Path $report -Pattern "ходатайтсво" -Quiet)) { throw "в отчёте нет ожидаемой ошибки" }

      - name: "Корректор (окно без экрана: открыть, проверить, сохранить)"
        shell: pwsh
        run: |
          $exe = (Resolve-Path "dist/bundle/Корректор/Корректор.exe").Path
          $out = Join-Path $env:RUNNER_TEMP "gui"
          New-Item -ItemType Directory -Force $out | Out-Null
          $p = Start-Process -FilePath $exe -ArgumentList @("--self-test", (Resolve-Path "tests/samples/образец.docx").Path, "--out", $out) -Wait -PassThru
          if (Test-Path (Join-Path $out "самопроверка.txt")) { Get-Content (Join-Path $out "самопроверка.txt") }
          if ($p.ExitCode -ne 0) { throw "окно завершилось с кодом $($p.ExitCode)" }
          if (-not (Test-Path (Join-Path $out "образец_проверено.docx"))) { throw "окно не сохранило копию" }

      - uses: actions/upload-artifact@v7
        with:
          name: sborki-win64
          path: dist/bundle/*.zip

      - uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: dist/bundle/*.zip
